# ============================================================================
# PATHS
# ============================================================================
set-environment -g PATH "/usr/local/bin:/usr/bin:/bin:$PATH"

# ============================================================================
# PLUGINS (via TPM)
# ============================================================================
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'tmux-plugins/tmux-yank'

# tmux-yank settings: which clipboard to use
# clipboard - for Ctrl+C/Ctrl+V (main clipboard)
# primary   - for middle mouse button selection
set -g @yank_selection 'clipboard'
set -g @yank_selection_mouse 'primary'

# ============================================================================
# BASIC SETTINGS
# ============================================================================

# Enable mouse support (scroll, pane selection, resizing)
set -g mouse on

# Enable OSC 52 for transmission via terminal (important for SSH)
set-option -g set-clipboard on

# Vi-style key bindings for copy mode navigation
set-window-option -g mode-keys vi

# ============================================================================
# KEY BINDINGS
# ============================================================================

# Switch windows with Shift+Up/Down (without prefix)
bind-key -n S-Up next-window
bind-key -n S-Down previous-window

# ============================================================================
# APPEARANCE
# ============================================================================

# Highlight active window in status bar
set -g window-status-current-style "bg=yellow, fg=black, bold"

# ============================================================================
# TPM INITIALIZATION (MUST BE LAST)
# ============================================================================
run '~/.tmux/plugins/tpm/tpm'
